! SYNTHETIC FIXTURE: hand-written, not taken from any device. See fixtures/synthetic/README.md.
! Exercises PLAN 3.2's threshold shape: exactly one remote syslog server, which CIS accepts (>= 1)
! and the DISA STIG does not (>= 2). No real fixture has exactly one; replace this file when one is found.
!
version 15.2
hostname synthetic-one-syslog
!
logging host 192.0.2.10
!
ntp server 192.0.2.20
ntp server 192.0.2.21
!
interface GigabitEthernet0/0
 ip address 198.51.100.1 255.255.255.0
!
line vty 0 4
 transport input ssh
!
end
